<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>整合應用程式服務</title>
    
    <style>
        /* 重置基礎樣式，確保完全滿版沒有留白 */
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            /* 預設隱藏外層捲軸，由 iframe 內部內容自行捲動 */
            overflow: hidden; 
            background-color: #ffffff;
            font-family: "Inter", "Noto Sans TC", sans-serif;
        }

        /* 
         * WCAG 2.0 規範 2.4.1：區塊可跳過
         * 為使用鍵盤導覽的使用者提供跳過導覽連結 
         */
        .skip-link {
            position: absolute;
            top: -50px;
            left: 0;
            background: #000000;
            color: #ffffff;
            padding: 12px 16px;
            font-weight: bold;
            z-index: 9999;
            text-decoration: none;
            transition: top 0.2s ease;
        }

        /* WCAG 2.0 規範 2.4.7：焦點可見，並符合 1.4.3 最小對比度 */
        .skip-link:focus {
            top: 0;
            outline: 3px solid #FFBF47; /* 高對比的焦點提示 */
            outline-offset: 2px;
        }

        /* 主容器設定 */
        .app-container {
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* iframe 滿版設定，移除所有邊框 */
        .content-frame {
            flex-grow: 1;
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }
    </style>
</head>
<body>
    <!-- 無障礙跳過連結 -->
    <a href="#main-frame" class="skip-link">跳至主要應用程式內容</a>

    <!-- 語意化 main 標籤，並標註 ARIA 角色 -->
    <main class="app-container" aria-label="主要內容區塊">
        <!-- 
          WCAG 2.0 規範 4.1.2：名稱、角色、數值
          iframe 必須具備具描述性的 title 屬性，供螢幕閱讀器朗讀 
        -->
        <iframe 
            id="main-frame" 
            class="content-frame"
            src="https://script.google.com/macros/s/AKfycbzFtkI7eG-5VAzt4wtFjmcBN3xk9Lr409VmyLc5e0pCuKlMBqJDMK2So_Cqn3iaglLQ/exec" 
            title="互動式資料表單與應用服務"
            allowfullscreen>
        </iframe>
    </main>

    <script>
        /**
         * 跨網域高度自動調整 (Cross-Origin Iframe Resizing)
         * 監聽來自 Google Apps Script 的 postMessage 事件。
         * 若您的 GAS 網頁有發送高度資訊，這裡將會接收並調整 iframe 高度。
         */
        window.addEventListener('message', function(event) {
            // 驗證訊息內容格式是否為我們所定義的
            if (event.data && event.data.type === 'resize-iframe' && event.data.height) {
                const iframe = document.getElementById('main-frame');
                const newHeight = event.data.height + 'px';
                
                // 調整 iframe 高度
                iframe.style.height = newHeight;
                
                // 取消父層的 overflow hidden，讓外層可以捲動
                document.body.style.overflow = 'auto';
                document.querySelector('.app-container').style.height = 'auto';
                
                console.log('已根據嵌入網頁調整高度：', newHeight);
            }
        });
    </script>
</body>
</html>
