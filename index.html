<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>我的網路書房</title>
  <style>
    /* ===== 基礎重設與滿版設定 ===== */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden; /* 避免父頁面出現重複捲軸 */
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color: #ffffff;
    }

    /* ===== 無障礙：跳至主內容區連結 (WCAG 2.4.1 & 2.4.7) ===== */
    .skip-link {
      position: absolute;
      top: -100px;
      left: 10px;
      background-color: #005fcc; /* 文字對比度 4.5:1 以上 */
      color: #ffffff;
      padding: 12px 20px;
      z-index: 9999;
      font-size: 1rem;
      font-weight: bold;
      text-decoration: none;
      border-radius: 4px;
      transition: top 0.2s ease;
    }

    .skip-link:focus {
      top: 10px;
      outline: 3px solid #ffbf47; /* 高對比焦點視覺 */
      outline-offset: 2px;
    }

    /* ===== 主內容區域容器 ===== */
    main {
      width: 100vw;
      height: 100vh;
      height: 100dvh; /* 支援現代行動裝置動態視埠 */
      display: flex;
      flex-direction: column;
    }

    /* 無障礙隱藏標題 (WCAG 1.3.1) */
    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    /* ===== Iframe 滿版無邊框樣式 ===== */
    .app-iframe {
      width: 100%;
      height: 100%;
      border: 0;
      display: block;
    }
  </style>
</head>
<body>

  <!-- 無障礙快速跳轉連結 (WCAG 2.4.1) -->
  <a href="#main-content" class="skip-link">跳至主要內容區</a>

  <!-- 主要內容區語意化標籤 (WCAG 1.3.1) -->
  <main id="main-content" tabindex="-1">
    <h1 class="sr-only">嵌入式應用程式內容系統</h1>
    <iframe 
      id="app-frame"
      class="app-iframe"
      src="https://script.google.com/macros/s/AKfycbzFtkI7eG-5VAzt4wtFjmcBN3xk9Lr409VmyLc5e0pCuKlMBqJDMK2So_Cqn3iaglLQ/exec"
      title="我的網路書房" 
      allow="geolocation; microphone; camera; midi; encrypted-media;"
      sandbox="allow-forms allow-modals allow-popups allow-popups-to-escape-sandbox allow-same-origin allow-scripts allow-top-navigation">
    </iframe>
  </main>

  <script>
    // 跨網域高度動態接收監聽 (針對 postMessage 溝通方案)
    window.addEventListener('message', function(event) {
      // 接收內嵌頁面傳送的高度變更訊息
      if (event.data && event.data.type === 'resize' && event.data.height) {
        const iframe = document.getElementById('app-frame');
        if (iframe) {
          iframe.style.height = event.data.height + 'px';
        }
      }
    });
  </script>
</body>
</html>
